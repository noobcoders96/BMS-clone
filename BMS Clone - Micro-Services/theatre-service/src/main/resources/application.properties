spring.application.name=theatre-service
server.port=8083

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# DB Setup
spring.datasource.url=jdbc:postgresql://ep-damp-flower-aztkzj5f-pooler.c-3.ap-southeast-1.aws.neon.tech/theatre
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Logging
logging.level.com.bookmyshow.theatreservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG