spring.application.name=booking-service
server.port=8084

##Eureka Registration
eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


#DB Set up
spring.datasource.url=jdbc:postgresql://ep-damp-flower-aztkzj5f-pooler.c-3.ap-southeast-1.aws.neon.tech/booking
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#to initialize create query for data.sql
#spring.jpa.defer-datasource-initialization=true

#Trace Cache Hit and Miss
logging.level.org.springframework.cache=TRACE
